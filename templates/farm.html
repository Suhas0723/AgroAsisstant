    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
        <title>AgroAssistant</title>
        <style>
            main {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #map {

                height: 75vh;
                width: 75%;
            }
        </style>

        <script src="https://maps.googleapis.com/maps/api/js?key={{ key }}&libraries=drawing" defer>
        </script>

    </head>

    <body>
        <div class="container">
            <aside>
                <div class="toggle">
                    <div class="logo">
                        <img src="{{ url_for('static', filename='agroAssisstantLogo.png') }}"
                            style="width: 25px; height: 25px">
                        <h2>Agro<span class="success">Assistant</span></h2>
                    </div>
                </div>
                <div class="sidebar">
                    <a href="/">
                        <span class="material-icons-sharp">dashboard</span>
                        <h3>Dashboard</h3>
                    </a>
                    <a href="/crops/show-crops">
                        <span class="material-icons-sharp">yard</span>
                        <h3>Crops</h3>
                    </a>
                    <a href="/water-usage">
                        <span class="material-icons-sharp">water_drop</span>
                        <h3>Water Usage</h3>
                    </a>
                    <a href="/chatbot" class="active">
                        <span class="material-icons-sharp">forum</span>
                        <h3>AgriAI</h3>
                    </a>
                    <a href="/diagnosis">
                        <span class="material-icons-sharp">
                            medical_services
                        </span>
                        <h3>Diagnosis</h3>
                    </a>
                    <a href="/profile">
                        <span class="material-icons-sharp">account_circle</span>
                        <h3>Profile</h3>
                    </a>

                    <a href="/logout">
                        <span class="material-icons-sharp">logout</span>
                        <h3>Logout</h3>
                    </a>
                </div>
            </aside>
            <main>
                <div id="map"></div>
            </main>
            <script>
                function initMap() {
                    const map = new google.maps.Map(document.getElementById("map"), {
                        center: { lat: 33.7490, lng: -84.3880 },
                        zoom: 18,
                        mapTypeId: "satellite"
                    });

                    const drawingManager = new google.maps.drawing.DrawingManager({
                        drawingMode: google.maps.drawing.OverlayType.RECTANGLE,
                        drawingControl: true,
                        drawingControlOptions: {
                            position: google.maps.ControlPosition.TOP_CENTER,
                            drawingModes: ['rectangle']
                        },
                        rectangleOptions: {
                            fillColor: "#00FF00",
                            fillOpacity: 0.3,
                            strokeWeight: 2,
                            editable: false,
                            draggable: false
                        }
                    });

                    drawingManager.setMap(map);

                    google.maps.event.addListener(drawingManager, 'overlaycomplete', function (event) {
                        if (event.type === 'rectangle') {
                            const bounds = event.overlay.getBounds();
                            const sw = bounds.getSouthWest();
                            const ne = bounds.getNorthEast();

                            const rectData = {
                                southwest: [sw.lat(), sw.lng()],
                                northeast: [ne.lat(), ne.lng()]
                            };
                            console.log('Rectangle coordinates:', rectData);



                        }
                    });
                }

                window.onload = initMap;
            </script>

        </div>

        <script src="{{ url_for('static', filename='index.js') }}"></script>
    </body>

    </html>
</body>

</html>
